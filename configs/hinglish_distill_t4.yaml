# Stage 2 -- distill the Hinglish teacher into the 6-layer CPU model.
#
# The student regresses the teacher's classifier-free-guided backbone output
# (distill_cfg_coef 2.0), so it generates at guided quality in one pass and runs
# with the stock pocket-tts CLI. It starts from the released english_2026-09
# student (distilled from the same teacher family), not from a slice of the
# teacher: far fewer steps are needed to adapt it to Hinglish. The sampler and
# EOS heads are copied from the teacher and frozen.
model_config: ${POCKET_TTS}/pocket_tts/config/english_2026-09.yaml
start_from_pretrained: false
distill_cfg_coef: 2.0
distill_teacher_config: ${POCKET_TTS}/pocket_tts/config/english_2026-09_24l.yaml
distill_teacher_weights: ${RUNS}/teacher/model.safetensors   # EMA weights of stage 1
student_init_from: hf://kyutai/pocket-tts/languages/english_2026-09/model.safetensors@983151f13aaeab1b13c1e5e3c2c383d49a9edf3f

data:
  train_jsonl: ${DATA}/manifests/train_aligned.jsonl
  valid_jsonl: ${DATA}/manifests/valid_aligned.jsonl
  max_duration_sec: 15.0
  max_voice_prompt_sec: 5.0
  loader_procs: 2
  num_bucket_batches: 4

flow:
  type: lsd
  kwargs: {}

# The teacher's targets are always fully conditioned; dropping the student's
# conditioning would ask it to predict them from a null input.
text_dropout: 0.0
voice_dropout: 0.0
stats_ema_steps: 0

optim:
  lr: 1.0e-4
  schedule: constant
  warmup_steps: 300

run_dir: ${RUNS}/student
batch_size: 16
grad_accum_steps: 2
max_steps: 60000
compile: false
ema_decay: 0.999
log_freq: 25
valid_freq: 1000
num_valid_batches: 8
ckpt_freq: 1000
num_ckpt_keep: 1
sample_freq: 1000
sample_temp: 0.3
sample_cfg_coef: 1.0       # guidance is baked in
sample_sentences:
  - "Namaste! Aaj ka mausam bahut accha hai, chalo bahar chalte hain."
  - "Mera laptop hang ho gaya, isliye main meeting thodi der se join karunga."
  - "Kya aap mujhe bata sakte hain ki nearest metro station kahan hai?"
